function thump(f,d,v){const o=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter(),t=ac.currentTime;fl.type='lowpass';fl.frequency.value=220;o.frequency.value=f;o.connect(gn);gn.connect(fl);fl.connect(ac.destination);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05)}
function beat(){if(!lis)return;if(S.sound){thump(70,.14,.9);setTimeout(()=>thump(55,.1,.6),170)}lis.tm=setTimeout(beat,60000/(E.fhr.v||140))}

 <h2 class="sec">${L('البيانات والخصوصية','Data & privacy')}</h2><section class="card"><div class="row"><button class="btn o" onclick="expo()">${ic('down')}${L('تصدير البيانات','Export data')}</button><button class="btn o" onclick="if(confirm(L('مسح التنبيهات وسجل الجلسات؟','Clear alerts and session log?'))){alerts=[];ses=[];sv('alerts',[]);sv('ses',[]);toast(L('تم المسح','Cleared'))}">${ic('trash')}${L('مسح السجل','Clear log')}</button></div><div class="mut">${L('كل البيانات تُحفظ محليًا على هذا الجهاز في هذا النموذج التجريبي.','In this prototype all data is stored locally on this device.')}</div></section>
 <h2 class="sec">${L('حول التطبيق','About')}</h2><section class="card"><div class="kv"><span>${L('الإصدار','Version')}</span><b>0.3 ${L('تجريبي','prototype')}</b></div><div class="kv"><span>${L('مصدر البيانات','Data source')}</span><b>${L('محاكاة','Simulation')}</b></div><div class="kv"><span>${L('الذكاء الاصطناعي','AI')}</span><b style="font-size:.74rem;text-align:end">TensorFlow.js · simple-statistics</b></div><div class="kv"><span>${L('الرسوم البيانية','Charts')}</span><b>Chart.js</b></div>
 <p class="mut">${L('محاكاة PPG: مجموع دالتَي غاوس بأسلوب NeuroKit2 / PPGSynth. نبض الجنين: عملية AR(1) مع تسارعات مرتبطة بالحركة وغلاف دوبلر تركيبي. وزن الجنين: Hadlock 1991. لا يوجد في JavaScript مكتبة PPG ناضجة جاهزة، فالمحاكي مدمج هنا ويمكن استبداله بخادم NeuroKit2.','PPG simulation: sum of two Gaussians (NeuroKit2 / PPGSynth style). Fetal heart rate: AR(1) process with movement-linked accelerations and a synthetic Doppler envelope. Fetal weight: Hadlock 1991. No mature ready-made PPG library exists for JavaScript, so the simulator is built in and can be swapped for a NeuroKit2 server.')}</p><p class="mut">${L('هذا النموذج ليس جهازًا طبيًا ولا بديلًا عن التشخيص أو الرعاية الطبية.','This prototype is not a medical device and not a substitute for diagnosis or medical care.')}</p></section>`};
function expo(){const b=new Blob([JSON.stringify({settings:S,lmp,alerts,sessions:ses,exported:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='safe-nest-data.json';a.click()}
/* waveform loop */
const pb=Array(200).fill(0),db=Array(200).fill(0);let pt=0;
function wave(c,buf,col,mid){const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.beginPath();buf.forEach((v,i)=>{const X=i*W/199,Y=mid?H/2-v*H*.42:H-12-v*(H-30);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();if(mid){x.beginPath();buf.forEach((v,i)=>{const X=i*W/199,Y=H/2+v*H*.42;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.globalAlpha=.45;x.stroke();x.globalAlpha=1}}
setInterval(()=>{pt+=.04;const on=conn&&q>=60;pb.push(on?SIM.ppg(pt,E.hr.v||82)+SIM.gn()*.015:0);pb.shift();db.push(conn&&preg().w>=10?SIM.dop(pt,E.fhr.v||140)*(.8+.2*SIM.gn()*.3):0);db.shift();const a=$('#ppg'),b=$('#dop');if(a)wave(a,pb,pri(),0);if(b)wave(b,db,pri(),1)},40);
/* ===== kick counter + contraction timer (auto-detected by the patch in simulation, manual entry always available) ===== */
let kk=[],ct=[],ks=null,kh=ld('khist',[]),krc=0,kbase=null,cs={last:0,lr:0};
(()=>{const T=Date.now();for(let t=T-400000;t<T;t+=1000)if(Math.random()<.15)kk.push({t,s:'a'})})(); /* simulated patch history so the baseline exists at start */
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const fs=s=>{s=Math.max(0,Math.round(s));return fg(Math.floor(s/60))+':'+String(s%60).padStart(2,'0')};
function logKick(s){const t=Date.now();mv.push(t);kk.push({t,s});if(kk.length>600)kk.shift();mvTot++;acc=Math.max(acc,9);if(ks&&kk.filter(x=>x.t>=ks.s).length>=10)finishKs(true)}
function startKs(){ks={s:Date.now()};upd()}
function finishKs(done){if(!ks)return;const n=kk.filter(x=>x.t>=ks.s).length;kh.unshift({t:ks.s,d:Math.round((Date.now()-ks.s)/1000),n,done:!!done});kh=kh.slice(0,20);sv('khist',kh);ks=null;toast(done?L('اكتمل العدّ: 10 حركات','Count complete: 10 movements'):L('تم حفظ الجلسة','Session saved'));upd()}
/* drop in kick rate vs the mother's own baseline (needs 8 consecutive seconds below threshold) */
function kickCheck(){const T=Date.now(),rr=kk.filter(x=>x.t>T-90000).length/90;
 if(kbase===null){const b=kk.filter(x=>x.t<=T-90000&&x.t>T-330000).length/240;if(b<.03)return 0;kbase=b}
 const ratio=rr/kbase,l=ratio<.2?2:ratio<.35?1:0;if(l===0&&E.mv.lvl===0)kbase=.995*kbase+.005*rr;krc=l?krc+1:0;return krc>=8?l:(l?E.mv.lvl:0)}
function ctSim(){const T=Date.now(),a=ct[0];if(a&&!a.e&&a.src==='a'&&T>=a.end)a.e=T;
 cs.lr=sc==='labor'?Math.min(1,cs.lr+.01):Math.max(0,cs.lr-.02);if(a&&!a.e)return;let go=false,dur=0;
 if(sc==='labor'){const iv=(100-cs.lr*40)*1000;if(!cs.last||T-cs.last>=iv*(.95+Math.random()*.1)){go=true;dur=(35+cs.lr*20)*1000}}
 else if(Math.random()<.0008){go=true;dur=(18+Math.random()*12)*1000}
 if(go){cs.last=T;ct.unshift({s:T,e:null,end:T+dur,src:'a'});ct=ct.slice(0,60)}}
function ctLevel(){const T=Date.now(),c=ct.filter(x=>x.e),w=preg().w;if(c.length<4||T-c[0].e>600000)return 0;
 const iv=[];for(let i=0;i<Math.min(c.length-1,5);i++)iv.push((c[i].s-c[i+1].s)/1000);const aI=mean(iv),aD=mean(c.slice(0,6).map(x=>(x.e-x.s)/1000));
 if(w<37)return c.filter(x=>x.s>T-1200000).length>=4&&iv.every(x=>x<=420)?2:0;
 return c.length>=6&&aI<=300&&aD>=45&&iv.every(x=>x<=360)?2:(aI<=600?1:0)}
function togCt(){const a=ct[0];if(a&&!a.e&&a.src==='m')a.e=Date.now();else if(!(a&&!a.e))ct.unshift({s:Date.now(),e:null,src:'m'});upd()}
B.trk=()=>`<section class="card"><div class="row"><b>${ic('hand')} ${L('عدّاد الركلات','Kick counter')}</b><span id="kb"></span></div>
<div class="row"><span class="mut">${ic('wifi')} ${L('عدّ تلقائي من اللصقة','Auto-count from patch')}</span>${tg('autokick')}</div><div id="kl"></div>
<div class="row"><button class="btn" id="kbtn" onclick="ks?finishKs():startKs()"></button><button class="btn o" onclick="logKick('m');upd()">${ic('hand')}${L('سجّلي ركلة','Log a kick')}</button></div>
<div style="height:120px;margin-top:10px"><canvas id="kc"></canvas></div><div class="mut">${L('الأعمدة: الركلات في كل دقيقة (آخر 10 دقائق).','Bars: kicks per minute (last 10 minutes).')}</div>
<p class="mut">${L('يُنبّهكِ التطبيق إذا انخفض معدل الركلات عن معدلكِ المعتاد، لكن لا تعتمدي عليه وحده: إن شعرتِ بنقص الحركة تواصلي مع الرعاية فورًا. إرشاد شائع: 10 حركات خلال ساعتين.','The app alerts you if your kick rate falls below your own usual rate, but do not rely on it alone: if you feel less movement contact your care provider immediately. Common guidance: 10 movements within 2 hours.')}</p><div id="kh"></div></section>
<section class="card"><div class="row"><b>${ic('act')} ${L('عدّاد الانقباضات','Contraction timer')}</b><span id="cb"></span></div><div id="cl"></div><button class="btn w" id="cbtn" onclick="togCt()"></button>
<p class="mut">${L('قاعدة 5-1-1 قرب الولادة: انقباضات كل 5 دقائق أو أقل، وتدوم دقيقة، لمدة ساعة. قبل الأسبوع 37 تستدعي الانقباضات المنتظمة تواصلًا فوريًا مع الرعاية. في المحاكاة تسير الأحداث أسرع من الواقع.','5-1-1 rule near term: contractions every 5 minutes or less, lasting a minute, for an hour. Before week 37 regular contractions need prompt contact with your care provider. Simulated events run faster than real life.')}</p></section>`;
P.trk=()=>{mkChart('kc',{type:'bar',data:{labels:Array.from({length:10},(_,i)=>i-9),datasets:[{data:[],backgroundColor:pri(),borderRadius:6}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{display:false}}}})};
U.trk=()=>{const T=Date.now(),on=conn,k60=kk.filter(x=>x.t>T-3600000).length,rr=kk.filter(x=>x.t>T-90000).length/90*60,n=ks?kk.filter(x=>x.t>=ks.s).length:0;
 $('#kb').innerHTML=bd(!on?3:E.mv.lvl);$('#kbtn').innerHTML=ks?ic('stop')+L('إنهاء الجلسة','End session'):ic('play')+L('بدء جلسة عدّ','Start counting session');
 $('#kl').innerHTML=`<div class="row"><div><div class="mut">${ks?L('الجلسة الحالية','Current session'):L('آخر ساعة','Last hour')}</div><div class="big">${ks?fg(n)+'<small style="font-size:1rem"> / 10</small>':fg(k60)}</div></div><div style="text-align:end"><div class="mut">${L('المعدل الحالي','Current rate')}</div><b>${on?fg(rr.toFixed(1)):'—'} ${L('/دقيقة','/min')}</b><div class="mut">${L('معدلكِ المعتاد','Your usual')} ${kbase?fg((kbase*60).toFixed(1)):'—'}</div></div></div>${ks?`<div class="bar"><i style="width:${Math.min(100,n*10)}%"></i></div><div class="mut">${L('المدة','Elapsed')} ${fs((T-ks.s)/1000)}</div>`:''}<div class="mut">${on?L('اللصقة متصلة وتحتسب الحركات (محاكاة).','Patch connected and counting movements (simulated).'):L('اللصقة غير متصلة: التسجيل اليدوي فقط.','Patch offline: manual logging only.')}</div>`;
 const c=charts.kc;if(c){const b=Array(10).fill(0);kk.forEach(x=>{const i=9-Math.floor((T-x.t)/60000);if(i>=0&&i<10)b[i]++});c.data.datasets[0].data=b;c.update()}
 $('#kh').innerHTML=kh.slice(0,3).map(s=>`<div class="kv"><span>${dt(new Date(s.t),{day:'numeric',month:'short'})} ${tm(s.t)}</span><b>${fg(s.n)} ${L('حركة','kicks')} · ${fs(s.d)}</b></div>`).join('');
 const a=ct[0],act=a&&!a.e,done=ct.filter(x=>x.e),iv=[];for(let i=0;i<Math.min(done.length-1,5);i++)iv.push((done[i].s-done[i+1].s)/1000);
 $('#cb').innerHTML=bd(!on&&!act?3:E.ct.lvl);$('#cbtn').innerHTML=a&&!a.e&&a.src==='m'?ic('stop')+L('انتهى الانقباض','Contraction ended'):ic('play')+L('بدأ انقباض','Contraction started');
 $('#cl').innerHTML=`<div class="row"><div><div class="mut">${act?L('انقباض جارٍ','Contraction in progress'):L('آخر انقباض','Last contraction')}</div><div class="big">${act?fs((T-a.s)/1000):done[0]?fs((done[0].e-done[0].s)/1000):'—'}</div></div><div style="text-align:end"><div class="mut">${L('متوسط المدة','Avg duration')} ${done.length?fs(mean(done.slice(0,6).map(x=>(x.e-x.s)/1000))):'—'}</div><div class="mut">${L('متوسط الفاصل','Avg interval')} ${iv.length?fs(mean(iv)):'—'}</div><div class="mut">${L('آخر ساعة','Last hour')}: ${fg(done.filter(x=>x.s>T-3600000).length)}</div></div></div>`+done.slice(0,6).map((x,i)=>`<div class="kv"><span>${tm(x.s)} · ${x.src==='a'?L('اللصقة','patch'):L('يدوي','manual')}</span><b>${fs((x.e-x.s)/1000)}${done[i+1]?' · '+L('فاصل','gap')+' '+fs((x.s-done[i+1].s)/1000):''}</b></div>`).join('')};
/* boot */
applyS();setInterval(tick,1000);
(()=>{const s=sess();if(s){$('#app').classList.remove('hide');go('home')}else authUI()})();
